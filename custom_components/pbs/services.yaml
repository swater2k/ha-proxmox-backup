# Targets are passed as a device_id field rather than a target block:
# Home Assistant removed device filters from target selectors, and without a
# filter the picker would offer every device in the house.

run_garbage_collection:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Datastore
          multiple: true

verify:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Datastore
            - integration: pbs
              model: PBS Backup Group
          multiple: true
    ignore_verified:
      selector:
        boolean:
    outdated_after:
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: d
          mode: box

prune:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Backup Group
          multiple: true
    dry_run:
      default: true
      selector:
        boolean:
    keep_last:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    keep_hourly:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    keep_daily:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    keep_weekly:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    keep_monthly:
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    keep_yearly:
      selector:
        number:
          min: 0
          max: 1000
          mode: box

forget_group:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Backup Group
          multiple: true
    confirm:
      required: true
      selector:
        boolean:

forget_snapshot:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Backup Group
          multiple: true
    backup_time:
      required: true
      selector:
        datetime:
    confirm:
      required: true
      selector:
        boolean:

set_protected:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: pbs
              model: PBS Backup Group
          multiple: true
    backup_time:
      required: true
      selector:
        datetime:
    protected:
      default: true
      selector:
        boolean:
